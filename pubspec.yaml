name: cashier_admin_keygen
description: 'Offline Ed25519 license key generator for Cashier POS'
publish_to: 'none'
version: 1.0.3+4

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  local_auth: ^2.3.0
  flutter_secure_storage: ^9.2.4
  mobile_scanner: ^6.0.2
  ed25519_edwards: ^0.3.1
  local_auth_darwin: ^1.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.8
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_native_splash:
  color: "#ffffff"
  image: assets/images/icon_1024.png
  android: true

  android_12:
      color: "#FFFFFF"
      image: assets/images/icon_1024.png


flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "assets/images/icon_1024.png"
  min_sdk_android: 21
