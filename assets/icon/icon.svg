<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="55%" stop-color="#3730A3"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#312E81"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>

    <linearGradient id="keyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="50%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <filter id="dropShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect x="0" y="0" width="512" height="512" rx="115" ry="115" fill="url(#bgGrad)"/>

  <!-- Subtle top highlight -->
  <rect x="0" y="0" width="512" height="512" rx="115" ry="115" fill="url(#bgGrad)"/>
  <ellipse cx="256" cy="60" rx="260" ry="140" fill="#FFFFFF" opacity="0.06"/>

  <!-- Shield backdrop (admin / security metaphor) -->
  <g filter="url(#dropShadow)">
    <path d="M256 84
             L364 122
             C364 122 366 250 364 288
             C360 356 306 404 256 428
             C206 404 152 356 148 288
             C146 250 148 122 148 122
             Z"
          fill="url(#shieldGrad)"
          stroke="#818CF8"
          stroke-width="6"
          stroke-opacity="0.35"/>
  </g>

  <!-- Inner shield highlight ring -->
  <path d="M256 108
           L344 140
           C344 140 346 248 344 280
           C340 338 298 378 256 400
           C214 378 172 338 168 280
           C166 248 168 140 168 140
           Z"
        fill="none"
        stroke="#A5B4FC"
        stroke-width="2.5"
        stroke-opacity="0.25"/>

  <!-- Key icon centered on shield -->
  <g filter="url(#softShadow)">
    <!-- Key head (circle with keyhole) -->
    <circle cx="222" cy="228" r="46" fill="url(#keyGrad)"/>
    <circle cx="222" cy="228" r="46" fill="none" stroke="#92400E" stroke-width="3" stroke-opacity="0.25"/>
    <circle cx="222" cy="228" r="18" fill="#1E1B4B"/>

    <!-- Key shaft -->
    <rect x="255" y="216" width="112" height="24" rx="6" fill="url(#keyGrad)"/>

    <!-- Key teeth -->
    <rect x="322" y="240" width="16" height="26" rx="4" fill="url(#keyGrad)"/>
    <rect x="346" y="240" width="16" height="34" rx="4" fill="url(#keyGrad)"/>
  </g>

  <!-- Small lock accent bottom-right of shield indicating "admin generated" -->
  <g transform="translate(292, 300)" filter="url(#softShadow)">
    <rect x="-24" y="4" width="48" height="36" rx="8" fill="#FDE68A"/>
    <path d="M-14 4 L-14 -10 C-14 -22 14 -22 14 -10 L14 4"
          fill="none" stroke="#FDE68A" stroke-width="7" stroke-linecap="round"/>
    <circle cx="0" cy="20" r="5" fill="#1E1B4B"/>
  </g>
</svg>
